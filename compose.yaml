services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verosnacks}
      POSTGRES_USER: ${POSTGRES_USER:-vero_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    expose:
      - 6379

  web:
    build:
      context: .
      dockerfile: Containerfile
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-vero_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-verosnacks}
      - UV_PROJECT_ENVIRONMENT=/venv
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: Containerfile
    command: uv run celery -A verosnacks worker -l info
    volumes:
      - .:/code
    environment:
      - REDIS_URL=redis://redis:6379/0
      - UV_PROJECT_ENVIRONMENT=/venv
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - redis

volumes:
  postgres_data: